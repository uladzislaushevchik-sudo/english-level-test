<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Level Test</title>
<style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f0f4f8}.s{width:28px;height:28px;border:3px solid #ccc;border-top-color:#0d47a1;border-radius:50%;animation:a .8s linear infinite;margin:0 auto 12px}@keyframes a{to{transform:rotate(360deg)}}</style></head><body>
<div style="text-align:center"><div class="s"></div><div id="m">Загрузка теста…</div></div>
<script>
(async()=>{
  try{
    const base="https://cdn.jsdelivr.net/gh/uladzislaushevchik-sudo/english-level-test@main/";
    const t="?t="+Date.now();
    const n=16;
    const parts=await Promise.all([...Array(n).keys()].map(i=>fetch(base+"e"+i+".txt"+t).then(r=>{if(!r.ok)throw new Error(r.status+" e"+i);return r.text()})));
    const html=new TextDecoder().decode(Uint8Array.from(atob(parts.map(s=>s.trim()).join("")),c=>c.charCodeAt(0)));
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById("m").textContent="Ошибка: "+e;}
})();
</script></body></html>
